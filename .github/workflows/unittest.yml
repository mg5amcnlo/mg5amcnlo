# This is a basic workflow to help you get started with Actions

name: running unittest
# Controls when the workflow will run
# branches: [ main LTS ]
on:
  # Triggers the workflow on push or pull request events but only for the 3.4.0 branch
  push:
    # All branches, no tags: a release tag points at a commit that already
    # ran this suite when it was pushed to main, and release.yml gates on
    # that main run rather than re-testing the same tree. '**' is needed
    # over '*' so branch names containing a slash still match.
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
# - '.github/**'

  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      message:
        description: 'running unittest' 
        required: true

env:
  commitmsg: ${{ github.event.head_commit.message }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"


  unittest_bundle_1:
    # former jobs, run one after the other: test_additional_unittest unittest_0
    #   unittest_2 unittest_3 unittest_7 unittest_11 unittest_12 unittest_16
    #   unittest_17 unittest_18_1 unittest_20 unittest_23 unittest_25
    #   unittest_26 unittest_28 unittest_31 unittest_32 unittest_33
    #   unittest_customize_model
