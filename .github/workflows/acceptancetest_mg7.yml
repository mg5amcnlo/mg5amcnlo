# This is a basic workflow to help you get started with Actions

name: running acceptance test (mg7)
# Controls when the workflow will run
#    branches: [ main LTS ]
on:
  # Triggers the workflow on push or pull request events but only for the 3.4.0 branch
  push:
    paths-ignore:
      - 'docs/**'
#      - '.github/**'

  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      message:
        description: 'running acceptance test'
        required: true

env:
  commitmsg: ${{ github.event.head_commit.message }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Build the madspace wheel exactly once per workflow run. The wheel is cached
  # with a content-addressed key (hash of the madspace sources), so it is only
  # rebuilt when madspace actually changes and is never shared between differing
  # builds. Every test job below depends on this job (needs: build_madspace) and
  # installs the cached wheel via the install_madspace action instead of
  # recompiling the C++/CUDA extension itself.
  build_madspace:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4

      - name: madspace cache key
        run: echo "MS_PY=$(python3 -c 'import sys;print(f"{sys.version_info.major}{sys.version_info.minor}")')" >> $GITHUB_ENV
        shell: bash

      # Cache the installed madspace/install prefix directly (not just a wheel),
      # so every test job restores a ready-to-use install and skips pip entirely.
      # hashFiles is evaluated before the build step creates madspace/install, so
      # the key is the clean-source hash and matches the install_madspace action.
      - name: Cache madspace install
        id: cache-madspace
        uses: actions/cache@v5
        with:
          path: madspace/install
          key: madspace-${{ runner.os }}-py${{ env.MS_PY }}-${{ hashFiles('madspace/**') }}

      # Built from the in-tree source (scikit-build-core / cmake). Upgrade pip +
      # packaging first: the runner ships an ancient pip whose build isolation
      # does not provide packaging>=22, which scikit-build-core's vendored
      # pyproject_metadata requires.
      #
      # ENABLE_OPENBLAS=ON builds OpenBLAS from source and links it statically
      # into the extension (see madspace/CMakeLists.txt), so the cached install
      # is self-contained and needs no system libopenblas at runtime. This avoids
      # a dynamic dependency that would otherwise only be satisfied on cache miss
      # (when apt installed libopenblas-dev) and missing on cache hit.
      #
      # --target installs into madspace/install, the prefix the mg7 runtime and
      # madspace/install.py expect.
      - name: Build and install madspace (only on cache miss)
        if: steps.cache-madspace.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE
          python3 -m pip install --upgrade pip packaging
          python3 -m pip install ./madspace \
            -Ccmake.define.ENABLE_OPENBLAS=ON \
            --target="$GITHUB_WORKSPACE/madspace/install"
        shell: bash

  acceptancetest_mg7_ufo_aloha:
    needs: build_madspace
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_mg7_ufo_aloha
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_mg7_ufo_aloha -pA -t0 -l INFO

  acceptancetest_mg7_output_directory:
    needs: build_madspace
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_output_mg7_directory
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_output_mg7_directory -pA -t0 -l INFO

  acceptancetest_mg7_ungroup_decay:
    needs: build_madspace
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_ungroup_decay_mg7
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_ungroup_decay_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_e_p_collision:
    needs: build_madspace
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_e_p_collision_mg7
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_e_p_collision_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_leshouche_sextet:
    needs: build_madspace
    # xfail: mg7 does not yet generate leshouche.inc (kept on the to-do list)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_ufomodel
      - name: test one of the test test_leshouche_sextet_diquarks_mg7
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_leshouche_sextet_diquarks_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_madspin_mixed_flavor:
    needs: build_madspace
    # xfail: mg7 + MadSpin pipeline not wired up yet (kept on the to-do list)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_madspin_mixed_flavor_decay_log_summary_mg7
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_madspin_mixed_flavor_decay_log_summary_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_group_subprocess:
    needs: build_madspace
    # mg7 cross-section run (u u > u u). madspace is installed by checkout_mg5;
    # LHAPDF (incl. NNPDF23_lo_as_0130_qed) comes from the heptools cache.
    # The test self-skips if that stack is unavailable.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_heptools_lhapdf
      - name: test one of the test test_group_subprocess_mg7
        run: |
            cd $GITHUB_WORKSPACE
            # make the cached lhapdf-config resolvable so the test finds the data dir
            export PATH="$HOME/.cache/HEPtools/bin:$PATH"
            ./tests/test_manager.py test_group_subprocess_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_merged_flavor_uq:
    needs: build_madspace
    # KNOWN-FAILING (not xfail): mg7 currently segfaults on u q > u q with the
    # merged q = u d multiparticle. This job is expected to be red until the mg7
    # integrator handles merged-flavor processes; it keeps the crash visible.
    # The test self-skips if the madspace + LHAPDF(NNPDF23) stack is unavailable.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_heptools_lhapdf
      - name: test one of the test test_madevent_merged_flavor_uq_mg7
        run: |
            cd $GITHUB_WORKSPACE
            export PATH="$HOME/.cache/HEPtools/bin:$PATH"
            ./tests/test_manager.py test_madevent_merged_flavor_uq_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_e_e_collision:
    needs: build_madspace
    # KNOWN-FAILING (not xfail): mg7 has no lepton-beam support (run_card.toml
    # only carries a hadron PDF), so e+ e- > e+ e- aborts with
    # "PID 11 not found in pdf grid". Red until mg7 supports lepton beams.
    # Self-skips if the madspace + LHAPDF(NNPDF23) stack is unavailable.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_heptools_lhapdf
      - name: test one of the test test_e_e_collision_mg7
        run: |
            cd $GITHUB_WORKSPACE
            export PATH="$HOME/.cache/HEPtools/bin:$PATH"
            ./tests/test_manager.py test_e_e_collision_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_generation_heft:
    needs: build_madspace
    # KNOWN-FAILING (not xfail): mg7 runs HEFT g g > b b~ HIW but its cross
    # section is ~257x below the physical value (~1.6e6 vs 4.117e8 pb). Red
    # until the mg7 normalisation for the effective ggH coupling is fixed.
    # Self-skips if the madspace + LHAPDF(NNPDF23) stack is unavailable.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/install_madspace
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_heptools_lhapdf
      - name: test one of the test test_generation_heft_mg7
        run: |
            cd $GITHUB_WORKSPACE
            export PATH="$HOME/.cache/HEPtools/bin:$PATH"
            ./tests/test_manager.py test_generation_heft_mg7 -pA -t0 -l INFO

  acceptancetest_mg7_mssm_gogo:
    # mg7/madmatrix now generates the MSSM merged-flavor squark/gluino vertices
    # (single-merged-leg / event-by-event flavored couplings); standalone_mg7
    # reproduces the Fortran standalone per-flavor |M|^2 (~1e-4). This is a
    # matrix-element (standalone) check only -- full mg7 event generation for
    # merged-flavor processes is not wired up yet (see test_madevent_merged_
    # flavor_uq_mg7). The madevent counterpart is test_madevent_mssm_gogo in
    # acceptancetest_madevent.yml.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore-pip-cache
      - name: test one of the test test_standalone_mg7_mssm_gogo
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_standalone_mg7_mssm_gogo -pA -t0 -l INFO

  acceptancetest_mg7_mssm_gogo_xsec:
    # KNOWN-FAILING (not xfail): standalone_mg7 reproduces the per-flavor |M|^2
    # for MSSM p p > go go (test_standalone_mg7_mssm_gogo), but full mg7 event
    # generation for merged-flavor processes is not wired up yet -- the madspace
    # integrator does not produce the cross-section. This pins the mg7 result to
    # the madevent reference (4.541638 pb, run_01 of test_generation_from_file_1)
    # and is expected to be red until the mg7 integrator handles merged-flavor
    # p p > go go. Self-skips if the madspace + LHAPDF(NNPDF23) stack is absent.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_heptools_lhapdf
      - name: test one of the test test_generation_from_file_1_mg7
        run: |
            cd $GITHUB_WORKSPACE
            export PATH="$HOME/.cache/HEPtools/bin:$PATH"
            ./tests/test_manager.py test_generation_from_file_1_mg7 -pA -t0 -l INFO


