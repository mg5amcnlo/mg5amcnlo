      - name: Install libtirpc-dev
        run: sudo apt install -y libtirpc-dev

      # ---- test_short_check_ppwy ----
      # p p > w+ y [QCD] using the loop_smgrav model (spin-2 graviton wavefunction).
      - name: "test_short_check_ppwy: test test_short_check_ppwy"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_check_ppwy -pP -t0 -l INFO

      # ---- test_short_calculate_xsect_script ----
      # Cross-section computation driven by bin/calculate_xsect for p p > e+ ve [QCD].
      - name: "test_short_calculate_xsect_script: test test_short_calculate_xsect_script"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_calculate_xsect_script -pP -t0 -l INFO

      # ---- test_short_generate_events_shower_scripts ----
      # Exercises bin/generate_events + bin/shower with HERWIG6 hep and top output,
      # including nsplit_jobs > 1 splitting.
      - name: "test_short_generate_events_shower_scripts: test test_short_generate_events_shower_scripts"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            sudo apt install libtirpc-dev
            ./tests/test_manager.py test_short_generate_events_shower_scripts -pP -t0 -l INFO

      # ---- test_short_generate_events_name ----
      # bin/generate_events with an explicit run name, default HERWIG6 shower.
      - name: "test_short_generate_events_name: test test_short_generate_events_name"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            sudo apt install libtirpc-dev
            ./tests/test_manager.py test_short_generate_events_name -pP -t0 -l INFO


  parallel_bundle_8:
    # former jobs, run one after the other: test_short_launch_amcatnlo_name
    #   test_short_ML5_sm_vs_stored_ML4 test_decay_comparator_heft
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # ---- test_short_launch_amcatnlo_name ----
      # p p > e+ ve [QCD] launched via aMC@NLO with an explicit run name.
      - name: "test_short_launch_amcatnlo_name: test test_short_launch_amcatnlo_name"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_launch_amcatnlo_name -pP -t0 -l INFO

      # ---- test_short_ML5_sm_vs_stored_ML4 ----
      - name: "test_short_ML5_sm_vs_stored_ML4: test test_short_ML5_sm_vs_stored_ML4"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_ML5_sm_vs_stored_ML4 -pP -t0 -l INFO

      # ---- test_decay_comparator_heft ----
      # bin/generate_events with an explicit run name, default HERWIG6 shower.
      - name: "test_decay_comparator_heft: test test_decay"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_decay_heft test_decay_sm -pP -t0 -l INFO


  parallel_bundle_9:
    # former jobs, run one after the other: test_short_ML5_sm_vs_stored_ML5
    #   test_long_sm_vs_stored_ML5_gg_zccx
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # ---- test_short_ML5_sm_vs_stored_ML5 ----
      # ---------------------------------------------------------------------------
      # tests/parallel_tests/test_ML5.py — MadLoop5 standalone comparisons against
      # stored ML4/ML5 reference pickles. Needs the loop infrastructure (CutTools,
      # IREGI, ninja, collier) from heptools.
      # ---------------------------------------------------------------------------
      - name: "test_short_ML5_sm_vs_stored_ML5: test test_short_ML5_sm_vs_stored_ML5"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_ML5_sm_vs_stored_ML5 -pP -t0 -l INFO

      # ---- test_long_sm_vs_stored_ML5_gg_zccx ----
      # bin/generate_events with an explicit run name, default HERWIG6 shower.
      - name: "test_long_sm_vs_stored_ML5_gg_zccx: test test_decay"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_long_sm_vs_stored_ML5_gg_zccx -pP -t0 -l INFO


  parallel_bundle_10:
    # former jobs, run one after the other:
    #   test_short_generate_events_nlo_hw6_stdhep
    #   test_short_generate_events_nlo_py6_stdhep test_decay_comparator_nmssm2
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # StdHEP needs the rpc headers: install them before the first NLO output,
      # which compiles StdHEP once for all the tests below (a failed compilation
      # leaves vendor/StdHEP/fail and is not retried)
      - name: Install libtirpc-dev
        run: sudo apt install -y libtirpc-dev

      # ---- test_short_generate_events_nlo_hw6_stdhep ----
      # ---------------------------------------------------------------------------
      # tests/parallel_tests/test_cmd_amcatnlo.py shower-driven short tests.
      # HERWIG6 / PYTHIA6 sources ship in Template/NLO/MCatNLO/{srcHerwig,srcPythia}
      # and StdHEP is built on demand from vendor/StdHEP, so restore_all is enough.
      # ---------------------------------------------------------------------------
      # NLO event generation, showered with HERWIG6, output as StdHEP.
      - name: "test_short_generate_events_nlo_hw6_stdhep: test test_short_generate_events_nlo_hw6_stdhep"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            sudo apt install libtirpc-dev
            ./tests/test_manager.py test_short_generate_events_nlo_hw6_stdhep -pP -t0 -l INFO

