            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_heft -pP -t0 -l INFO

      # ---- test_short_cross_mssm1 ----
      # Compares MadEvent cross-section against hard-coded g g > go go (MSSM) values.
      - name: "test_short_cross_mssm1: test test_short_cross_mssm1"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_mssm1 -pP -t0 -l INFO


  parallel_bundle_5:
    # former jobs, run one after the other: test_short_check_eejjj_lo_lhapdf
    #   test_short_generate_events_nlo_hw6_split
    #   test_short_check_generate_events_nlo_py6pt_fsr
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # StdHEP needs the rpc headers: install them before the first NLO output,
      # which compiles StdHEP once for all the tests below (a failed compilation
      # leaves vendor/StdHEP/fail and is not retried)
      - name: Install libtirpc-dev
        run: sudo apt install -y libtirpc-dev

      # ---- test_short_check_eejjj_lo_lhapdf ----
      # ---------------------------------------------------------------------------
      # tests/parallel_tests/test_cmd_amcatnlo.py — NLO command tests. These use
      # the aMC@NLO command shell and need the full heptools cache (CutTools,
      # IREGI, ninja, collier for loop integrals; lhapdf for PDFs).
      # Tests that drive HERWIG6 / PYTHIA6PT / PYTHIA6Q showers are NOT wired
      # because the parton shower binaries are not part of the heptools cache.
      # ---------------------------------------------------------------------------
      # e+ e- > p p p [real=QCD] at LO with pdlabel='lhapdf'.
      - name: "test_short_check_eejjj_lo_lhapdf: test test_short_check_eejjj_lo_lhapdf"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_check_eejjj_lo_lhapdf -pP -t0 -l INFO

      # ---- test_short_generate_events_nlo_hw6_split ----
      # NLO event generation split into multiple HERWIG6 shower sub-jobs.
      - name: "test_short_generate_events_nlo_hw6_split: test test_short_generate_events_nlo_hw6_split"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            sudo apt install libtirpc-dev
            ./tests/test_manager.py test_short_generate_events_nlo_hw6_split -pP -t0 -l INFO

      # ---- test_short_check_generate_events_nlo_py6pt_fsr ----
      # Negative test: PYTHIA6PT must refuse to shower a process with final-state radiation.
      - name: "test_short_check_generate_events_nlo_py6pt_fsr: test test_short_check_generate_events_nlo_py6pt_fsr"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            sudo apt install libtirpc-dev
            ./tests/test_manager.py test_short_check_generate_events_nlo_py6pt_fsr -pP -t0 -l INFO


  parallel_bundle_6:
    # former jobs, run one after the other: test_short_split_evt_gen_zeroev
    #   test_ML5_uux_ddx test_long_sm_vs_stored_HCR_uxu_zz_QED
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # ---- test_short_split_evt_gen_zeroev ----
      # p p > e+ e- [real=QCD] with split event generation when a channel has zero events.
      - name: "test_short_split_evt_gen_zeroev: test test_short_split_evt_gen_zeroev"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_short_split_evt_gen_zeroev -pP -t0 -l INFO

      # ---- test_ML5_uux_ddx ----
      # bin/generate_events with an explicit run name, default HERWIG6 shower.
      - name: "test_ML5_uux_ddx: test test_decay"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_uuxddx_SplitOrders_vs_stored_ML5 -pP -t0 -l INFO

      # ---- test_long_sm_vs_stored_HCR_uxu_zz_QED ----
      # bin/generate_events with an explicit run name, default HERWIG6 shower.
      - name: "test_long_sm_vs_stored_HCR_uxu_zz_QED: test test_decay"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_long_sm_vs_stored_HCR_uxu_zz_QED -pP -t0 -l INFO


  parallel_bundle_7:
    # former jobs, run one after the other: test_short_check_ppwy
    #   test_short_calculate_xsect_script
    #   test_short_generate_events_shower_scripts
    #   test_short_generate_events_name
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # StdHEP needs the rpc headers: install them before the first NLO output,
      # which compiles StdHEP once for all the tests below (a failed compilation
