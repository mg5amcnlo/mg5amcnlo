# This is a basic workflow to help you get started with Actions

name: running parralel test
# Controls when the workflow will run
#    branches: [ main LTS ]
on:
  # Triggers the workflow on push or pull request events but only for the 3.4.0 branch
  push:
    # All branches, no tags: a release tag points at a commit that already
    # ran this suite when it was pushed to main, and release.yml gates on
    # that main run rather than re-testing the same tree. '**' is needed
    # over '*' so branch names containing a slash still match.
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
#      - '.github/**'

  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      message:
        description: 'running parralel test'
        required: true

env:
  commitmsg: ${{ github.event.head_commit.message }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"


  parallel_bundle_1:
    # former jobs, run one after the other: test_short_cross_sqso1
    #   test_gauge_6_e500 test_short_cross_pol test_short_sm test_short_sqso
    #   test_short_polarization test_short_cross_sm3
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - name: Reset MG5 config
        run: cp input/.mg7_configuration_default.txt input/mg7_configuration.txt
      - uses: ./.github/actions/restore_heptools_core
      - uses: ./.github/actions/restore-pip-cache

      # ---- test_short_cross_sqso1 ----
      - name: "test_short_cross_sqso1: test test_short_cross_sqso1"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_sqso1 -pP -t0 -l INFO

      # ---- test_gauge_6_e500 ----
      - name: "test_gauge_6_e500: test test_gauge_6_e500"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_gauge_6_e500 -pP -t0 -l INFO

      # ---- test_short_cross_pol ----
      - name: "test_short_cross_pol: test test_short_cross_pol"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py  test_short_cross_pol -pP -t0 -l INFO

      # ---- test_short_sm ----
      # ---------------------------------------------------------------------------
      # tests/parallel_tests/compare_with_old_mg5_version.py — pickle-based short
      # tests. These do NOT need the old MG5 install: test_short_{sm,mssm,heft,
      # polarization,sqso} use comparisons stored in input_files/*.pkl, and the
      # test_short_cross_{sm1,sm2,sm3,mssm1} variants compare against hard-coded
      # cross-section values. Only numpy (+ UFO MSSM_SLHA2 / heft for the model
      # variants) is needed.
      # ---------------------------------------------------------------------------
      - name: "test_short_sm: test test_short_sm"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_sm -pP -t0 -l INFO

      # ---- test_short_sqso ----
      - name: "test_short_sqso: test test_short_sqso"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_sqso -pP -t0 -l INFO

      # ---- test_short_polarization ----
      - name: "test_short_polarization: test test_short_polarization"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_polarization -pP -t0 -l INFO

      # ---- test_short_cross_sm3 ----
      # Compares MadEvent cross-section against hard-coded g g > t t~ decay-chain values.
      - name: "test_short_cross_sm3: test test_short_cross_sm3"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_sm3 -pP -t0 -l INFO


  parallel_bundle_2:
    # former jobs, run one after the other: test_gauge_4_e500 test_gauge_6_e90
    #   test_short_cross_sm1 test_short_cross_gauge test_short_gauge
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - name: Reset MG5 config
        run: cp input/.mg7_configuration_default.txt input/mg7_configuration.txt
      - uses: ./.github/actions/restore_heptools_core
      - uses: ./.github/actions/restore-pip-cache

      # ---- test_gauge_4_e500 ----
      - name: "test_gauge_4_e500: test test_gauge_4_e500"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_gauge_4_e500 -pP -t0 -l INFO

      # ---- test_gauge_6_e90 ----
      - name: "test_gauge_6_e90: test test_gauge_6_e90"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_gauge_6_e90 -pP -t0 -l INFO

      # ---- test_short_cross_sm1 ----
      - name: "test_short_cross_sm1: test test_short_cross_sm1"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_sm1 -pP -t0 -l INFO

      # ---- test_short_cross_gauge ----
      # Short gauge cross-section comparison (tests/parallel_tests/compare_gauge.py)
      - name: "test_short_cross_gauge: test test_short_cross_gauge"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_gauge -pP -t0 -l INFO

      # ---- test_short_gauge ----
      # Short LO gauge-invariance comparison (tests/parallel_tests/compare_gauge.py)
      - name: "test_short_gauge: test test_short_gauge"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_gauge -pP -t0 -l INFO


  test_short_ppgogo_amcatnlo_nlo:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - name: Reset MG5 config
        run: cp input/.mg7_configuration_default.txt input/mg7_configuration.txt
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore-pip-cache

      # Runs a set of commands using the runners shell
      - name: test test_short_ppgogo_amcatnlo_nlo
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py  test_short_amcatnlo_int_nlo -pP -t0 -l INFO


  parallel_bundle_3:
    # former jobs, run one after the other: test_short_softcol_nlo
    #   test_short_gauge_loop test_short_cross_sm2
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - name: Reset MG5 config
        run: cp input/.mg7_configuration_default.txt input/mg7_configuration.txt
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore-pip-cache

      # ---- test_short_softcol_nlo ----
      - name: "test_short_softcol_nlo: test test_short_ppgogo_amcatnlo_nlo"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_ppgogo_amcatnlo_nlo -pP -t0 -l INFO

      # ---- test_short_gauge_loop ----
      # Short loop gauge-invariance comparison (tests/parallel_tests/compare_gauge.py)
      - name: "test_short_gauge_loop: test test_short_gauge_loop"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_gauge_loop -pP -t0 -l INFO

      # ---- test_short_cross_sm2 ----
      # Compares MadEvent cross-section against hard-coded u j > W+ g / g g > W+ j j values.
      - name: "test_short_cross_sm2: test test_short_cross_sm2"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
            ./tests/test_manager.py test_short_cross_sm2 -pP -t0 -l INFO


  parallel_bundle_4:
    # former jobs, run one after the other: test_short_mssm test_short_heft
    #   test_short_cross_mssm1
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v5
      - name: Reset MG5 config
        run: cp input/.mg7_configuration_default.txt input/mg7_configuration.txt
      - uses: ./.github/actions/restore_heptools_core
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_ufomodel

      # ---- test_short_mssm ----
      # Needs MSSM_SLHA2 UFO model from the UFOmodeldb cache.
      - name: "test_short_mssm: test test_short_mssm"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            cp Template/LO/Source/.make_opts Template/LO/Source/make_opts
