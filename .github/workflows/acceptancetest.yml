# This is a basic workflow to help you get started with Actions

name: running acceptance test (rest)
# Controls when the workflow will run
#    branches: [ main LTS ]
on:
  # Triggers the workflow on push or pull request events but only for the 3.4.0 branch
  push:
    # All branches, no tags: a release tag points at a commit that already
    # ran this suite when it was pushed to main, and release.yml gates on
    # that main run rather than re-testing the same tree. '**' is needed
    # over '*' so branch names containing a slash still match.
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
#      - '.github/**'

  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      message:
        description: 'running acceptance test'
        required: true

env:
  commitmsg: ${{ github.event.head_commit.message }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # test_ieva_collision and test_eva_oldrelease_collision are not run: they
  # assert run_card defaults (evaorder=1, resp. eva_xcut=0) that do not match
  # the current ones (evaorder=0, eva_xcut=1).
  # test_mw_wproduction and test_mw_wjjproduction (test_madweight) are not
  # run: MadWeight is excluded from CI on request.

  acceptancetest_bundle_1:
    # former jobs, run one after the other: readonly_gridpack
    #   acceptancetest_emela3
    # Each keeps its own steps, run even when an earlier one failed.
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools
      - uses: ./.github/actions/restore_all

      # ---- readonly_gridpack ----
      # concurrent read-only gridpack generation: build a gridpack, freeze it
      # (restore_data default + chmod -R 555 madevent) and run it from several
      # empty directories simultaneously.
      - name: "readonly_gridpack: test concurrent read-only gridpack"
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_concurrent_readonly_gridpack -pA -t0 -l INFO

      # ---- acceptancetest_emela3 ----
      - name: "acceptancetest_emela3"
        if: ${{ !cancelled() }}
        run: |
            ./tests/test_manager.py test_generate_eeww_nlo_emela_noph -pA -t0 -l INFO


  acceptancetest_5:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout_mg5
      - uses: ./.github/actions/restore_heptools_core
      - uses: ./.github/actions/restore-pip-cache
      - uses: ./.github/actions/restore_ufomodel
      # Runs a set of commands using the runners shell
      - name: test one of the test test_config
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_config -pA -t0 -l INFO
            ./tests/test_manager.py test_draw -pA -t0 -l INFO
            ./tests/test_manager.py test_generate -pA -t0 -l INFO
