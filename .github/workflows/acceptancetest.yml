        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py test_ML_gauge_invariance_epem_ttx_all_modes -pA -t0 -l INFO

      # ---- acceptancetest_polarised_rotation_at_rest ----
      # MadLoop's rotation stability test must stay a symmetry when a polarised
