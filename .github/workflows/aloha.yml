# This is a basic workflow to help you get started with Actions

name: running test for aloha
# Controls when the workflow will run
#    branches: [ main LTS ]
on:
  # Triggers the workflow on push or pull request events but only for the 3.4.0 branch
  push:
    # All branches, no tags: a release tag points at a commit that already
    # ran this suite when it was pushed to main, and release.yml gates on
    # that main run rather than re-testing the same tree. '**' is needed
    # over '*' so branch names containing a slash still match.
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
#      - '.github/**'

  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      message:
        description: 'running aloha test'
        required: true

env:
  commitmsg: ${{ github.event.head_commit.message }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test_aloha:
    # The type of runner that the job will run on
    # Runs on the self-hosted alma10 runners (cern1, ...) to spare the hosted queue;
    # fork PRs stay on ubuntu-24.04 so outside code never runs on our machines.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted", "alma10"]') }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - uses: ./.github/actions/clean_tmp

      # Runs a set of commands using the runners shell
      - name: test one of the test test_helas_diagrams_gg_wpwmttx
        run: |
            cd $GITHUB_WORKSPACE
            echo "import model MSSM_SLHA2" > cmd
            ./bin/madgraph cmd
            ./tests/test_manager.py -pP -t0 test_aloha.* -e test_short_mssm_subset_creation

      # Leave /tmp empty for the next job on this self-hosted machine.
      - if: always()
        uses: ./.github/actions/clean_tmp

  test_excluded:
    # excluded due to side effect
    # The type of runner that the job will run on
    # Runs on the self-hosted alma10 runners (cern1, ...) to spare the hosted queue;
    # fork PRs stay on ubuntu-24.04 so outside code never runs on our machines.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted", "alma10"]') }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - uses: ./.github/actions/clean_tmp

      # Runs a set of commands using the runners shell
      - name: test one of the test test_short_mssm_subset_creation
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py -pP -t0 test_short_mssm_subset_creation #excluded from aloha	    

      # Leave /tmp empty for the next job on this self-hosted machine.
      - if: always()
        uses: ./.github/actions/clean_tmp
