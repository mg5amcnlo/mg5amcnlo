            ./tests/test_manager.py  test_nlo_reweighting -pA -t0 -l INFO

      # one process per test: two rw_me libraries in one python collide
      - name: NLO-mode reweighting with a new parameter (rw_mevirt)
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/home/runner/.cache/HEPtools/lhapdf6_py3/lib
