      # Runs a set of commands using the runners shell
      - name: test one of the test test_loop_improved_reweighting
        run: |
            cd $GITHUB_WORKSPACE
            export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/home/runner/.cache/HEPtools/lhapdf6_py3/lib
