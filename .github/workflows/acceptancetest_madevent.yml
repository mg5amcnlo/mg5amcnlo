            ./tests/test_manager.py  test_nlo_reweighting_new_parameter -pA -t0 -l INFO

      - name: failing reweighting run out of process
        if: ${{ !cancelled() }}
        run: |
            cd $GITHUB_WORKSPACE
            ./tests/test_manager.py  test_reweighting_failure_out_of_process -pA -t0 -l INFO


