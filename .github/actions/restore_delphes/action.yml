name: Restore Delphes cache
description: Restores Delphes (and its ROOT dependency) from a dedicated cache and configures MG5

# Delphes depends only on ROOT. Both live in the dedicated ~/.cache/Delphes
# cache (kept separate from HEPtools); the delphes-<os> cache is stacked on top
# of the root-<os> one, exactly like the HEPtools sub-caches.

inputs:
  setup_only:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Ensure the ROOT environment (ROOTSYS/PATH/LD_LIBRARY_PATH) is set up,
    # restoring the root cache only if a higher level did not already do so.
    - name: restore ROOT
      uses: ./.github/actions/restore_root
      with:
        setup_only: ${{ inputs.setup_only }}

    - name: Set cache key
      run: echo "CACHE_KEY=delphes-$ImageOS" >> $GITHUB_ENV
      shell: bash

    - uses: actions/cache/restore@v5
      if: ${{ inputs.setup_only != 'true' }}
      with:
        path: ~/.cache/Delphes
        key: ${{ env.CACHE_KEY }}

    - run: |
        cd $GITHUB_WORKSPACE
        echo "delphes_path = $HOME/.cache/Delphes/Delphes" >> input/mg5_configuration.txt
      shell: bash
