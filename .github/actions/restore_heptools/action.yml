name: Restore full heptools cache
description: Restores heptools from cache and sets MG5 accordingly

runs:
  using: composite
  steps:
    - name: get os
      run: echo "CACHE_KEY=heptools-v2-$ImageOS" >> $GITHUB_ENV && echo "OLD_CACHE_KEY=heptools-$ImageOS" >> $GITHUB_ENV
      shell: bash

    # warm_cache.yml saves the combined cache under a generation-suffixed key,
    # "heptools-v2-<ImageOS>-<run_id>", so that a refresh adds a new entry instead
    # of having to delete the current one first (GitHub caches are immutable,
    # and the delete-then-save it used to need left a ~30 min window in which
    # every consumer missed). Nothing outside that run can know the generation,
    # so the exact key below is deliberately unmatchable here and restore-keys
    # does the work: GitHub serves the newest entry with the given prefix, i.e.
    # the previous generation while a new one is being built.
    # "v2" is the layout of the tree (Pythia8 built against HepMC3, no
    # MG5aMC_PY8_interface; see warm_cache.yml). The previous, unversioned
    # generation ("heptools-<ImageOS>-<run_id>" and the older bare
    # "heptools-<ImageOS>") is only a fallback until warm_cache has built a v2
    # entry; branches that predate v2 keep using it. The same scheme is used by
    # every restore_heptools_* action.
    - name: restore full cache
      id: heptools-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/HEPtools
        key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-
          ${{ env.OLD_CACHE_KEY }}-
          ${{ env.OLD_CACHE_KEY }}

    # A failed download is only a warning of actions/cache ("Egress is over the
    # account limit", "The operation was aborted": the 1.1 GB cache stops part
    # way) and leaves nothing restored. The sub-caches below are no fallback
    # then: warm_cache.yml deletes them after a successful run. So try once more
    # after a pause before going on.
    - name: wait before retrying the restore
      if: steps.heptools-cache.outputs.cache-matched-key == ''
      run: |
        echo "::warning::the heptools cache was not restored, retrying in 60 s"
        rm -rf ~/.cache/HEPtools
        sleep 60
      shell: bash
    - name: restore full cache (retry)
      id: heptools-cache-retry
      if: steps.heptools-cache.outputs.cache-matched-key == ''
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/HEPtools
        key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-
          ${{ env.OLD_CACHE_KEY }}-
          ${{ env.OLD_CACHE_KEY }}

    # NB: cache-hit is true only on an *exact* key match, which now essentially
    # never happens here; cache-matched-key is non-empty whenever something was
    # actually restored (exact match or restore-keys). That is the condition
    # that means "we have a combined cache to look at".
    - name: combined cache restored
      id: restored
      run: echo "key=${{ steps.heptools-cache.outputs.cache-matched-key || steps.heptools-cache-retry.outputs.cache-matched-key }}" >> $GITHUB_OUTPUT
      shell: bash

    # Same content check the warm_cache jobs run before saving, in "report"
    # mode: here an incomplete combined cache is not fatal, we just fall back
    # to the (still present) sub-caches below.
    - name: validate cache content
      id: validate-cache
      if: steps.restored.outputs.key != ''
      uses: ./.github/actions/check_heptools
      with:
        tools: lhapdf boost pythia8 emela contur looptools
        mode: report

    # setup other environment of previous level of cache
    # try to use their cache if previous cache failed or content is incomplete
    - uses: ./.github/actions/restore_heptools_lhapdf
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}
    - uses: ./.github/actions/restore_heptools_boost
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}
    - uses: ./.github/actions/restore_heptools_pythia8
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}
    - uses: ./.github/actions/restore_heptools_emela
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}
    - uses: ./.github/actions/restore_heptools_contur
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}
    - uses: ./.github/actions/restore_heptools_looptools
      with:
        setup_only: ${{ steps.restored.outputs.key != '' && steps.validate-cache.outputs.valid == 'true' }}

    # Every consumer gets the lhapdf configuration written above. Without
    # lhapdf there (neither cache could be restored), stop here with the reason
    # instead of letting the tests fail on a missing lhapdf-config.
    - name: check that lhapdf was restored
      run: |
        if [ ! -x ~/.cache/HEPtools/bin/lhapdf-config ]; then
          echo "::error::the HEPtools cache could not be restored (see the warnings of the restore steps, e.g. 'Egress is over the account limit'), so lhapdf is missing: re-run the job"
          exit 1
        fi
      shell: bash
