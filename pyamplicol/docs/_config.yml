title: pyAmpliCol
description: Fast color-ordered scattering amplitudes from Python and native APIs.
url: https://madgraph.org
baseurl: /pyamplicol
repository: MadGraphTeam/pyamplicol
permalink: pretty

remote_theme: just-the-docs/just-the-docs@2ed4c0af735e95af5c0dcf7a605b07d903005b4e
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      image: /assets/pyamplicol_social_preview.png

logo: /assets/pyamplicol_logo.png
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  rel_url: true
  focus_shortcut_key: "k"
enable_copy_code_button: true
heading_anchors: true
nav_enabled: true
back_to_top: true
back_to_top_text: Back to top

relative_links:
  enabled: true
  collections: true

readme_index:
  with_frontmatter: true

aux_links:
  Repository:
    - https://github.com/MadGraphTeam/pyamplicol
  PyPI:
    - https://pypi.org/project/pyamplicol/
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/MadGraphTeam/pyamplicol
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

callouts:
  tip:
    title: Tip
    color: blue
  important:
    title: Important
    color: purple
