# Helicity/color-resolved evaluation of one UFO-SM pp -> Zjj subprocess.
# Empty selector arrays mean all physical IDs stored in the artifact.

schema_version = 1
action = "evaluate"

[evaluation]
artifact = "artifacts/pp_zjj"
process = "d d~ > g z g"
precision = 16
resolved = true
helicity_ids = []
color_flow_ids = []
model_parameters = "data/model_parameters.json"
momenta = "data/pp_zjj_momenta.json"

[output]
format = "human"
color = "auto"
progress = "off"
