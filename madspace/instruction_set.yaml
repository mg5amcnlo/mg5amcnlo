obs_y:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "rapidity"
  dims: 0
  desc: "Rapidity of a four-momentum. See @ref Observable."

obs_y_abs:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
      desc: "absolute rapidity"
  dims: 0
