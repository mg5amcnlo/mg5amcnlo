      type: [float]
      desc: "center-of-mass energy"
  desc: "Invariant mass of the sum of all external momenta. See @ref Observable."

obs_e:
  inputs:
    - name: p
      type: [float, ..., 4]
      desc: "four-momentum"
  outputs:
    - name: obs
      type: [float, ...]
