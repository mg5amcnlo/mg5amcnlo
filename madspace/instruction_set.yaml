    - name: m_out
      type: [float, n]
      desc: "mass of each final-state particle"
    - name: pt_min
      type: [float, single, n]
      desc: "minimum transverse momentum per final-state particle"
    - name: y_max
      type: [float, single, n]
      desc: "maximum rapidity per final-state particle"
  outputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external momenta, incoming particles first"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Chili hadron-collider mapping from the unit hypercube to external momenta. Building block of @ref ChiliMapping."

chili_inverse:
  inputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external momenta, incoming particles first"
    - name: e_cm
      type: [float]
      desc: "hadronic center-of-mass energy"
    - name: m_out
      type: [float, n]
      desc: "mass of each final-state particle"
    - name: pt_min
      type: [float, single, n]
      desc: "minimum transverse momentum per final-state particle"
    - name: y_max
