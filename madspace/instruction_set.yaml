---
title: Interface to ME and PDF

matrix_element:
  inputs: any
  outputs: any
  class: MatrixElementInstruction
  custom_op: True
  desc: "Evaluates a loaded matrix element on a batch of momenta. See @ref MatrixElement."

collect_channel_weights:
  inputs:
    - name: amp2
      type: [float, n]
      desc: "squared amplitude per diagram"
    - name: channel_indices
      type: [int, single, n]
      desc: "channel index of each diagram"
    - name: channel_count
      type: [size, c]
      desc: "number of channels"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "weight per channel"
  desc: "Sums squared amplitudes into per-channel weights. Building block of @ref PropagatorChannelWeights."

interpolate_pdf:
  inputs:
    - name: x
      type: [float]
      desc: "momentum fraction"
    - name: q
      type: [float]
      desc: "factorization scale"
    - name: pid_indices
      type: [int, n]
      desc: "grid index for each requested parton flavour"
    - name: grid_logx
      type: [float, single, a]
      desc: "log-x grid nodes"
    - name: grid_logq2
      type: [float, single, b]
      desc: "log-Q2 grid nodes"
    - name: grid_coeffs
      type: [float, single, 16, c, d]
      desc: "bicubic interpolation coefficients"
  outputs:
    - name: pdf
      type: [float, n]
      desc: "PDF value per requested flavour"
  vectorized: False
  desc: "Evaluates parton densities by bicubic interpolation of a log-x / log-Q2 grid. See @ref PartonDensity."

interpolate_alpha_s:
  inputs:
    - name: q
      type: [float]
      desc: "renormalization scale"
    - name: grid_logq2
      type: [float, single, b+1]
      desc: "log-Q2 grid nodes"
    - name: grid_coeffs
      type: [float, single, 4, b]
      desc: "cubic interpolation coefficients"
  outputs:
    - name: alpha_s
      type: [float]
      desc: "the strong coupling at q"
  vectorized: False
  desc: "Evaluates the running coupling by cubic interpolation of a log-Q2 grid. See @ref RunningCoupling."

---
title: Normalizing flows and MLPs

convert_float32:
  inputs:
    - name: in1
      type: [float64, ...]
      desc: "double-precision tensor"
  outputs:
    - name: out
      type: [float32, ...]
      desc: "the input rounded to single precision"
  dims: 0
  vectorized: False
  differentiable: True
  desc: "Converts a tensor to single precision. Used at the boundaries of single-precision @ref MLP networks."

convert_float64:
  inputs:
    - name: in1
      type: [float32, ...]
      desc: "single-precision tensor"
  outputs:
    - name: out
      type: [float64, ...]
      desc: "the input in double precision"
  dims: 0
  vectorized: False
  differentiable: True
  desc: "Converts a tensor to double precision. Used at the boundaries of single-precision @ref MLP networks."

matmul_to_float64:
  inputs:
    - name: x
      type: [float32, n]
      backward_arg: True
    - name: weight
      type: [float32, single, m, n]
      backward_arg: True
    - name: bias
      type: [float32, single, m]
  outputs:
    - name: y
      type: [float64, m]
  custom_op: True
  differentiable: True
  desc: "Single-precision affine map whose result is converted to double precision. Equivalent to @ref convert_float64 applied to the output of @ref matmul, but the GPU backend fuses the bias addition and the conversion, and the backward pass fuses the gradient conversion with the bias gradient. Used for the last layer of single-precision @ref MLP networks."

matmul:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: y
      type: [float, m]
      desc: "the affine transform of the input"
  custom_op: True
  differentiable: True
  desc: "Affine layer y = weight x + bias. Building block of @ref MLP."

matmul_relu:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [ReluActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref relu, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref relu applied to the output of @ref matmul."

matmul_leaky_relu:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [LeakyReluActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref leaky_relu, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref leaky_relu applied to the output of @ref matmul."

matmul_elu:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [EluActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref elu, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref elu applied to the output of @ref matmul."

matmul_gelu:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [GeluActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref gelu, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref gelu applied to the output of @ref matmul."

matmul_sigmoid:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [SigmoidActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref sigmoid, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref sigmoid applied to the output of @ref matmul."

matmul_softplus:
  precision: [float32, float64]
  inputs:
    - name: x
      type: [float, n]
      desc: "input vector"
      backward_arg: True
    - name: weight
      type: [float, single, m, n]
      desc: "weight matrix"
      backward_arg: True
    - name: bias
      type: [float, single, m]
      desc: "bias vector"
  outputs:
    - name: linear
      type: [float, m]
      desc: "the affine transform of the input"
    - name: y
      type: [float, m]
      desc: "the activated affine transform"
  custom_op: matmul_activation
  custom_op_args: [SoftplusActivation]
  differentiable: True
  desc: "@ref matmul followed by @ref softplus, with the bias addition and the activation in one kernel. Produced by the GPU backend's lowering of @ref softplus applied to the output of @ref matmul."

relu:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise ReLU activation. Building block of @ref MLP."

leaky_relu:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise leaky ReLU activation. Building block of @ref MLP."

elu:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise ELU activation. Building block of @ref MLP."

gelu:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise GELU activation. Building block of @ref MLP."

sigmoid:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      backward_arg: True
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise sigmoid activation. Building block of @ref MLP."

scaled_tanh:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      backward_arg: True
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise scaled hyperbolic tangent activation. Building block of @ref MLP."

softplus:
  precision: [float32, float64]
  inputs:
    - name: in1
      type: [float, ...]
      desc: "input tensor"
  outputs:
    - name: out
      type: [float, ...]
      desc: "activated tensor"
  dims: 0
  differentiable: True
  desc: "Element-wise softplus activation. Building block of @ref MLP."

rqs_reshape:
  inputs:
    - name: input
      desc: "raw spline parameters from the subnetwork"
    - name: bin_count
      desc: "number of spline bins"
  outputs:
    - name: widths
      desc: "normalized bin widths"
    - name: heights
      desc: "normalized bin heights"
    - name: derivatives
      desc: "knot derivatives"
  class: RqsReshapeInstruction
  differentiable: True
  custom_op: True
  desc: "Reshapes raw network outputs into rational-quadratic-spline bin widths, heights and derivatives. Building block of @ref Flow."

rqs_find_bin:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to be transformed"
    - name: in_sizes
      type: [float, n, b]
      desc: "cumulative input-side bin sizes"
    - name: out_sizes
      type: [float, n, b]
      desc: "cumulative output-side bin sizes"
    - name: derivatives
      type: [float, n, b+1]
      desc: "knot derivatives"
  outputs:
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters for the active bin"
  differentiable: True
  dims: 2
  desc: "Builds the per-element spline condition by locating the active bin. Building block of @ref Flow."

rqs_forward:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
  differentiable: True
  dims: 2
  desc: "Applies a rational-quadratic spline in the forward direction. Building block of @ref Flow."

rqs_inverse:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
  differentiable: True
  dims: 2
  desc: "Applies a rational-quadratic spline in the inverse direction. Building block of @ref Flow."

rqs_forward_with_float32:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
    - name: output32
      type: [float32, n]
      desc: "the transformed values in single precision"
  differentiable: True
  dims: 2
  vectorized: False
  desc: "@ref rqs_forward that also returns its output in single precision, so that the conversion does not need a separate kernel. Produced by the GPU backend's lowering of @ref convert_float32 applied to the output of @ref rqs_forward."

rqs_inverse_with_float32:
  inputs:
    - name: input
      type: [float, n]
      desc: "values to transform"
    - name: condition
      type: [float, n, 6]
      desc: "packed spline parameters"
  outputs:
    - name: output
      type: [float, n]
      desc: "transformed values"
    - name: det
      type: [float, n]
      desc: "per-element Jacobian"
    - name: output32
      type: [float32, n]
      desc: "the transformed values in single precision"
  differentiable: True
  dims: 2
  vectorized: False
  desc: "@ref rqs_inverse that also returns its output in single precision, so that the conversion does not need a separate kernel. Produced by the GPU backend's lowering of @ref convert_float32 applied to the output of @ref rqs_inverse."

softmax:
  inputs:
    - name: input
      type: [float, ...]
      desc: "logits"
  outputs:
    - name: output
      type: [float, ...]
      desc: "normalized probabilities"
      backward_arg: True
  differentiable: True
  dims: 0
  desc: "Softmax over the last dimension. Building block of @ref DiscreteSampler."

softmax_prior:
  inputs:
    - name: input
      type: [float, n]
      desc: "logits"
    - name: prior
      type: [float, n]
      desc: "prior probabilities"
  outputs:
    - name: output
      type: [float, n]
      desc: "normalized probabilities"
      backward_arg: True
  differentiable: True
  desc: "Softmax over the last dimension reweighted by a prior. Building block of @ref DiscreteSampler."

---
title: Discrete sampling

sample_discrete:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: option_count
      type: [int]
      desc: "number of choices"
  outputs:
    - name: output
      type: [int]
      desc: "sampled index"
    - name: det
      type: [float]
      desc: "probability of the sampled index"
  desc: "Samples a uniform discrete choice from a random number. Building block of @ref DiscreteSampler."

sample_discrete_inverse:
  inputs:
    - name: index
      type: [int]
      desc: "index"
    - name: option_count
      type: [int, single]
      desc: "number of choices"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "probability of the index"
  desc: "Inverse of `sample_discrete`. Building block of @ref DiscreteSampler."

sample_discrete_probs:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: probs
      type: [float, n]
      desc: "probability of each choice"
  outputs:
    - name: output
      type: [int]
      desc: "sampled index"
    - name: det
      type: [float]
      desc: "probability of the sampled index"
  desc: "Samples a discrete choice from a given probability vector. Building block of @ref DiscreteFlow."

sample_discrete_probs_inverse:
  inputs:
    - name: index
      type: [int]
      desc: "index"
    - name: probs
      type: [float, n]
      desc: "probability of each choice"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "probability of the index"
  differentiable: True
  desc: "Inverse of `sample_discrete_probs`. Building block of @ref DiscreteFlow."

discrete_histogram:
  inputs:
    - name: input
      type: [int]
      desc: "discrete value per event"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: option_count
      type: [size, n]
      desc: "number of bins"
  outputs:
    - name: values
      type: [float, single, n]
      desc: "summed weight per bin"
    - name: counts
      type: [int, single, n]
      desc: "event count per bin"
  custom_op: True
  desc: "Accumulates a weighted histogram over a discrete variable. Building block of @ref DiscreteHistogram."

permute_momenta:
  inputs:
    - name: momenta
      type: [float, n, 4]
      desc: "input momenta"
    - name: permutations
      type: [int, single, m, n]
      desc: "table of permutations"
    - name: index
      type: [int]
      desc: "permutation index per event"
  outputs:
    - name: output
      type: [float, n, 4]
      desc: "permuted momenta"
  vectorized: False
  desc: "Reorders momenta according to a stored permutation selected per event. Building block of @ref MultiChannelMapping."

gather:
  inputs:
    - name: index
      type: [int]
      desc: "index to select"
      backward_arg: True
    - name: choices
      type: [float, n]
      desc: "vector of choices"
  outputs:
    - name: output
      type: [float]
      desc: "the selected entry"
  differentiable: True
  desc: "Selects one entry per event from a vector of float choices."

gather_int:
  inputs:
    - name: index
      type: [int]
      desc: "index to select"
    - name: choices
      type: [int, single, n]
      desc: "vector of choices"
  outputs:
    - name: output
      type: [int]
      desc: "the selected entry"
  desc: "Selects one entry per event from a vector of integer choices."

gather_vector:
  inputs:
    - name: index
      type: [int]
      desc: "row index to select"
    - name: choices
      type: [float, n, m]
      desc: "matrix of choices"
  outputs:
    - name: output
      type: [float, m]
      desc: "the selected row"
  vectorized: False
  desc: "Selects one row per event from a matrix of choices."

select_int:
  inputs:
    - name: input
      type: [int, n]
      desc: "source vector"
    - name: indices
      type: [int, m]
      desc: "indices to gather"
  outputs:
    - name: output
      type: [int, m]
      desc: "gathered entries"
  desc: "Gathers several entries from an integer vector by index."

select:
  inputs:
    - name: input
      type: [float, n]
      desc: "source vector"
    - name: indices
      type: [int, single, m]
      desc: "indices to gather"
      backward_arg: True
  outputs:
    - name: output
      type: [float, m]
      desc: "gathered entries"
  differentiable: True
  desc: "Gathers several entries from a float vector by index."

select_with_float32:
  inputs:
    - name: input
      type: [float, n]
      desc: "source vector"
    - name: indices
      type: [int, single, m]
      desc: "indices to gather"
      backward_arg: True
  outputs:
    - name: output
      type: [float, m]
      desc: "gathered entries"
    - name: output32
      type: [float32, m]
      desc: "the gathered entries in single precision"
  differentiable: True
  vectorized: False
  desc: "@ref select that also returns the gathered entries in single precision, so that the conversion does not need a separate kernel. Produced by the GPU backend's lowering of @ref convert_float32 applied to the output of @ref select."

select_vector:
  inputs:
    - name: input
      type: [float, n, k]
      desc: "source matrix"
    - name: indices
      type: [int, m]
      desc: "row indices to gather"
  outputs:
    - name: output
      type: [float, m, k]
      desc: "gathered rows"
  vectorized: False
  desc: "Gathers several rows from a matrix by index."

argsort:
  inputs:
    - name: input
      type: [float, n]
      desc: "vector to sort"
  outputs:
    - name: indices
      type: [int, n]
      desc: "permutation that sorts the input"
  vectorized: False
  desc: "Indices that sort a vector in ascending order."

quantile:
  inputs:
    - name: input
      type: [float]
      desc: "value per event"
    - name: q
      type: [float, single]
      desc: "quantile level in [0, 1]"
  outputs:
    - name: output
      type: [float, single]
      desc: "the estimated quantile"
  custom_op: True
  desc: "Estimates a quantile of a value over the batch."

one_hot:
  inputs:
    - name: index
      type: [int]
      desc: "index to encode"
    - name: option_count
      type: [size, n]
      desc: "length of the one-hot vector"
  outputs:
    - name: output
      type: [float, n]
      desc: "one-hot vector"
  desc: "One-hot encoding of a discrete index."

madnis_abs_weight:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: q
      type: [float]
      desc: "sampling density"
  outputs:
    - name: w
      type: [float]
      desc: "absolute weight f / q"
  differentiable: True
  desc: "Absolute integrand contribution used by the MadNIS loss. Building block of @ref MadnisLoss."

madnis_softclip:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: q
      type: [float]
      desc: "sampling density"
    - name: norm
      type: [float]
      desc: "normalization used for the clip threshold"
    - name: threshold
      type: [float]
      desc: "relative clipping threshold"
  outputs:
    - name: f_clip
      type: [float]
      desc: "softly clipped integrand"
  differentiable: True
  desc: "Softly clips the integrand to limit large weights during training. Building block of @ref MadnisLoss."

madnis_variance:
  inputs:
    - name: f
      type: [float]
      desc: "integrand value"
    - name: g
      type: [float]
      desc: "trained sampling density"
    - name: q
      type: [float]
      desc: "sampling density used to draw the event"
    - name: mean
      type: [float]
      desc: "running estimate of the integral"
  outputs:
    - name: w
      type: [float]
      desc: "per-event variance contribution"
  differentiable: True
  desc: "Per-event contribution to the variance loss. Building block of @ref MadnisLoss."

madnis_single_channel_variance:
  inputs:
    - name: var
      type: [float]
      desc: "running variance estimate"
    - name: abs_mean
      type: [float]
      desc: "running mean of the absolute weight"
      backward_arg: True
  outputs:
    - name: loss
      type: [float]
      desc: "the variance loss"
  differentiable: True
  desc: "Single-channel variance loss from its running moments. Building block of @ref MadnisLoss."

madnis_multi_channel_variance:
  inputs:
    - name: vars
      type: [float, c]
      desc: "running variance estimate per channel"
    - name: abs_means
      type: [float, c]
      desc: "running mean of the absolute weight per channel"
  outputs:
    - name: loss
      type: [float]
      desc: "the variance loss"
  differentiable: True
  desc: "Multi-channel variance loss summed over channels. Building block of @ref MadnisLoss."

---
title: Indexing

nonzero:
  inputs:
    - name: input
      desc: "mask, nonzero where an event is kept"
  outputs:
    - name: indices
      desc: "batch indices of the kept events"
  class: NonzeroInstruction
  custom_op: True
  desc: "Indices of the nonzero entries of a batched mask."

batch_gather:
  inputs:
    - name: indices
      desc: "batch indices to keep"
    - name: values
      desc: "values to select from"
  outputs:
    - name: selection
      desc: "the selected events"
  class: BatchGatherInstruction
  custom_op: True
  desc: "Selects events from a batch by index."

batch_scatter:
  inputs:
    - name: indices
      desc: "target batch indices"
    - name: target
      desc: "batch to write into"
    - name: source
      desc: "events to write"
  outputs:
    - name: output
      desc: "the updated batch"
  class: BatchScatterInstruction
  custom_op: True
  desc: "Writes source events into a target batch at the given indices."

---
title: Random numbers

random:
  inputs:
    - name: batch_size
      desc: "batch size to generate"
    - name: count
      desc: "random numbers per event"
  outputs:
    - name: output
      desc: "uniform random numbers in [0, 1]"
  class: RandomInstruction
  custom_op: True
  desc: "Draws a batch of uniform random numbers."

random_int:
  inputs:
    - name: batch_size
      desc: "batch size to generate"
    - name: max
      desc: "exclusive upper bound"
  outputs:
    - name: output
      desc: "random integers in [0, max)"
  class: RandomIntInstruction
  custom_op: True
  desc: "Draws a batch of uniform random integers."

unweight:
  inputs:
    - name: weights
      desc: "event weights"
    - name: max_weight
      desc: "maximum weight used for the acceptance test"
  outputs:
    - name: indices
      desc: "batch indices of the accepted events"
    - name: uw_weights
      desc: "residual weights of the accepted events"
  class: UnweightInstruction
  custom_op: True
  desc: "Accept/reject unweighting against a maximum weight. See @ref Unweighter."

---
title: VEGAS

vegas_forward:
  inputs:
    - name: input
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: grid
      type: [float, single, n, b]
      desc: "VEGAS bin edges per dimension"
  outputs:
    - name: output
      type: [float, n]
      desc: "remapped points"
    - name: det
      type: [float, n]
      desc: "per-dimension Jacobian"
  dims: 2
  desc: "Applies the VEGAS grid mapping in the forward direction. Building block of @ref VegasMapping."

vegas_inverse:
  inputs:
    - name: input
      type: [float, n]
      desc: "remapped points"
    - name: grid
      type: [float, single, n, b]
      desc: "VEGAS bin edges per dimension"
  outputs:
    - name: output
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: det
      type: [float, n]
      desc: "per-dimension Jacobian"
  dims: 2
  desc: "Inverse of `vegas_forward`. Building block of @ref VegasMapping."

vegas_histogram:
  inputs:
    - name: input
      type: [float, n]
      desc: "points in the unit hypercube"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: bin_count
      type: [size, b]
      desc: "number of grid bins per dimension"
  outputs:
    - name: values
      type: [float, single, n, b]
      desc: "summed weight per bin and dimension"
    - name: counts
      type: [int, single, n, b]
      desc: "event count per bin and dimension"
  custom_op: True
  desc: "Accumulates the weighted histograms VEGAS uses to refine its grid. Building block of @ref VegasHistogram."

histogram:
  inputs:
    - name: input
      type: [float, ...]
      desc: "value per event"
    - name: weights
      type: [float]
      desc: "event weight"
    - name: min
      type: [float]
      desc: "lower edge of the histogram range"
    - name: max
      type: [float]
      desc: "upper edge of the histogram range"
    - name: bin_count
      type: [size, b]
      desc: "number of interior bins"
  outputs:
    - name: values
      type: [float, single, b+2]
      desc: "summed weight per bin, with underflow and overflow"
    - name: square_values
      type: [float, single, b+2]
      desc: "summed squared weight per bin, for the statistical error"
  custom_op: True
  desc: "Accumulates a weighted histogram with underflow and overflow bins. See @ref Histogram."
