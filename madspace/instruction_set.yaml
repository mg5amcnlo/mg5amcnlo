s23_value_and_min_max_cut:
  inputs:
    - name: pa
      type: [float, 4]
      desc: "first incoming momentum"
    - name: p3
      type: [float, 4]
      desc: "momentum of the third particle"
    - name: t1_abs
      type: [float]
      desc: "absolute value of the first momentum transfer"
    - name: p1
      type: [float, 4]
      desc: "first outgoing momentum"
    - name: p2
      type: [float, 4]
      desc: "second outgoing momentum"
    - name: etmin_1
      type: [float]
      desc: "minimum transverse energy of the first outgoing particle"
    - name: etmin_2
      type: [float]
      desc: "minimum transverse energy of the second outgoing particle"
    - name: drcut
      type: [float]
      desc: "minimum angular separation between the outgoing particles"
    - name: s23_min_cut
      type: [float]
      desc: "explicit lower cut on the 2-3 invariant mass squared"
  outputs:
    - name: s_23
      type: [float]
      desc: "the 2-3 invariant mass squared"
    - name: s23_min
      type: [float]
      desc: "lower limit of the 2-3 invariant mass squared"
    - name: s23_max
      type: [float]
      desc: "upper limit of the 2-3 invariant mass squared"
  desc: "The 2-3 invariant mass squared and its cut-restricted limits. Building block of @ref TwoToThreeParticleScattering; see @ref Cuts."

s23_position:
  inputs:
    - name: s23
      type: [float]
      desc: "the 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
  outputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
  desc: "Position of the 2-3 invariant in its kinematic range, from both ends. Building block of @ref TwoToThreeParticleScattering."

s23_arcsine_sample:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_min
      type: [float]
      desc: "lower limit of the sampled 2-3 invariant mass squared"
    - name: s_max
      type: [float]
      desc: "upper limit of the sampled 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
    - name: power
      type: [float, single]
      desc: "exponent of the 1/(s - m^2)^power sampling, as in @ref Invariant"
    - name: mass
      type: [float, single]
      desc: "pole mass of the sampling, as in @ref Invariant"
  outputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
    - name: det
      type: [float]
      desc: "Jacobian d s23 / d r"
  desc: "Arcsine map in the azimuth composed with the importance sampling of the 2-3 invariant, returning its position in the kinematic range at full relative precision near both ends. Building block of @ref TwoToThreeParticleScattering."

s23_arcsine_sample_inverse:
  inputs:
    - name: u
      type: [float]
      desc: "position of s23 in its kinematic range"
    - name: u_c
      type: [float]
      desc: "1 - u"
    - name: s_min
      type: [float]
      desc: "lower limit of the sampled 2-3 invariant mass squared"
    - name: s_max
      type: [float]
      desc: "upper limit of the sampled 2-3 invariant mass squared"
    - name: s_phys_min
      type: [float]
      desc: "lower kinematic limit of the 2-3 invariant mass squared"
    - name: s_phys_max
      type: [float]
      desc: "upper kinematic limit of the 2-3 invariant mass squared"
    - name: power
      type: [float, single]
      desc: "exponent of the 1/(s - m^2)^power sampling, as in @ref Invariant"
    - name: mass
      type: [float, single]
      desc: "pole mass of the sampling, as in @ref Invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian d r / d s23"
  desc: "Inverse of `s23_arcsine_sample`. Building block of @ref TwoToThreeParticleScattering."

invariants_from_momenta:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: factors
      type: [float, single, m, n]
      desc: "coefficient matrix selecting the invariant combinations"
  outputs:
    - name: invariants
      type: [float, m]
      desc: "the requested invariant combinations"
  desc: "Linear combinations of the pairwise invariants built from the external momenta. Building block of @ref PropagatorChannelWeights."

sde2_channel_weights:
  inputs:
    - name: invariants
      type: [float, m]
      desc: "propagator invariants"
    - name: masses
      type: [float, single, c, n]
      desc: "propagator masses per channel"
    - name: widths
      type: [float, single, c, n]
      desc: "propagator widths per channel"
    - name: indices
      type: [int, single, c, n]
      desc: "invariant index feeding each propagator"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "normalized weight per channel"
  desc: "Single-diagram-enhanced channel weights from propagator invariants. Building block of @ref PropagatorChannelWeights."

subchannel_weights:
  inputs:
    - name: invariants
      type: [float, m]
      desc: "propagator invariants"
    - name: masses
      type: [float, single, c, n]
      desc: "propagator masses per channel"
    - name: widths
      type: [float, single, c, n]
      desc: "propagator widths per channel"
    - name: indices
      type: [int, single, c, n]
      desc: "invariant index feeding each propagator"
    - name: on_shell
      type: [int, single, c, n]
      desc: "flag marking on-shell propagators per channel"
    - name: group_sizes
      type: [int, single, g]
      desc: "number of subchannels in each channel group"
  outputs:
    - name: channel_weights
      type: [float, c]
      desc: "normalized weight per subchannel"
  desc: "Channel weights refined into subchannel weights using on-shell information. Building block of @ref SubchannelWeights."

apply_subchannel_weights:
  inputs:
    - name: channel_weights_in
      type: [float, c]
      desc: "weight per channel"
    - name: subchannel_weights
      type: [float, n]
      desc: "weight per subchannel"
    - name: channel_indices
      type: [int, single, d]
      desc: "channel index per diagram"
    - name: subchannel_indices
      type: [int, single, d]
      desc: "subchannel index per diagram"
  outputs:
    - name: channel_weights_out
      type: [float, d]
      desc: "weight per diagram"
  desc: "Combines channel and subchannel weights into a per-diagram weight. Building block of @ref SubchannelWeights."

compress_channel_weights:
  inputs:
    - name: channel_index
      type: [int]
      desc: "index of the current channel"
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
    - name: keep_count
      type: [size, k]
      desc: "number of channels to keep"
  outputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight"
  desc: "Keeps only the largest channel weights, returning them as a sparse list. Building block of @ref PropagatorChannelWeights."

restore_channel_weights:
  inputs:
    - name: chan_weight_values
      type: [float, k]
      desc: "the kept weights"
    - name: chan_weight_indices
      type: [int, k]
      desc: "channel index of each kept weight"
    - name: full_count
      type: [size, n]
      desc: "length of the dense weight vector"
  outputs:
    - name: channel_weights
      type: [float, n]
      desc: "dense weight per channel"
  desc: "Inverse of `compress_channel_weights`: expands the sparse weights back to a dense vector. Building block of @ref PropagatorChannelWeights."

pt_eta_phi_x:
  inputs:
    - name: p_ext
      type: [float, n+2, 4]
      desc: "external four-momenta, including the two incoming particles"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: output
      type: [float, 3n+2]
      desc: "flattened (pt, eta, phi) per final-state particle plus the two momentum fractions"
  desc: "Converts external momenta to the transverse-momentum, pseudorapidity, azimuth and momentum-fraction parametrization. Building block of @ref ChiliMapping."

mirror_momenta:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: mirror
      type: [int]
      desc: "per-event flag selecting whether to reflect"
  outputs:
    - name: p_mirror
      type: [float, n, 4]
      desc: "the possibly reflected momenta"
  desc: "Optionally reflects the momenta along the beam axis to symmetrize the final state."

momenta_to_x1x2:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: e_cm
      type: [float, single]
      desc: "hadronic center-of-mass energy"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  desc: "Recovers the beam momentum fractions from a set of external momenta."

boost_to_frame:
  inputs:
    - name: p_ext
      type: [float, n, 4]
      desc: "external four-momenta"
    - name: frame_mask
      type: [int, single, n]
      desc: "1 for every particle whose momenta are summed up to define the rest frame, 0 for the others"
  outputs:
    - name: p_frame
      type: [float, n, 4]
      desc: "all momenta boosted into that rest frame"
  desc: "Boosts the external momenta into the rest frame of the selected particles, the frame the run card's me_frame asks the matrix element to be evaluated in; a single selected particle comes out exactly at rest. See @ref MatrixElement."


---
title: Invariants

uniform_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant flat in s. Building block of @ref Invariant."

uniform_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `uniform_invariant`. Building block of @ref Invariant."

breit_wigner_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a Breit-Wigner density around the pole mass. Building block of @ref Invariant."

breit_wigner_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `breit_wigner_invariant`. Building block of @ref Invariant."

flat_window_breit_wigner_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: window
      type: [float, single]
      desc: "half-width of the flattened window, in units of the width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a Breit-Wigner density whose peak is flattened to a constant inside |sqrt(s) - mass| < window * width (the $-excluded region). Building block of @ref Invariant."

flat_window_breit_wigner_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "resonance mass"
    - name: width
      type: [float, single]
      desc: "resonance width"
    - name: window
      type: [float, single]
      desc: "half-width of the flattened window, in units of the width"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `flat_window_breit_wigner_invariant`. Building block of @ref Invariant."

stable_invariant:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a 1/s power law around a stable pole. Building block of @ref Invariant."

stable_invariant_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Inverse of `stable_invariant`. Building block of @ref Invariant."

stable_invariant_nu:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: nu
      type: [float, single]
      desc: "exponent of the power law"
    - name: s_min
      type: [float]
      desc: "lower bound of the invariant"
    - name: s_max
      type: [float]
      desc: "upper bound of the invariant"
  outputs:
    - name: s
      type: [float]
      desc: "sampled invariant"
    - name: gs
      type: [float]
      desc: "sampling density at s"
  desc: "Samples a propagator invariant with a tunable 1/s^nu power law. Building block of @ref Invariant."

stable_invariant_nu_inverse:
  inputs:
    - name: s
      type: [float]
      desc: "invariant value"
    - name: mass
      type: [float, single]
      desc: "pole mass"
    - name: nu
      type: [float, single]
      desc: "exponent of the power law"
    - name: s_min
