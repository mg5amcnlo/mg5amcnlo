title: Cuts

cut_unphysical:
  inputs:
    - name: w_in
      type: [float]
      desc: "incoming weight"
    - name: p
      type: [float, n, 4]
      desc: "final-state momenta"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: w_out
      type: [float]
      desc: "weight, set to zero for unphysical events"
  desc: "Zeroes the weight of events with unphysical momenta or momentum fractions. See @ref Cuts."

cut_one:
  inputs:
    - name: obs
      type: [float]
      desc: "observable value"
    - name: min
      type: [float, single]
      desc: "lower bound"
    - name: max
      type: [float, single]
      desc: "upper bound"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero when the observable is outside [min, max]"
  desc: "Zeroes the weight when a single observable falls outside its window. See @ref Cuts."

cut_all:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float, single]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float, single]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero unless all observables are in [min, max]"
  desc: "Zeroes the weight unless every observable in the vector is inside its window. See @ref Cuts."

cut_any:
  inputs:
    - name: obs
      type: [float, n]
      desc: "observable values"
    - name: min
      type: [float, single]
      desc: "lower bound applied to each observable"
    - name: max
      type: [float, single]
      desc: "upper bound applied to each observable"
  outputs:
    - name: w
      type: [float]
      desc: "weight, zero unless some observable is in [min, max]"
  desc: "Zeroes the weight unless at least one observable in the vector is inside its window. See @ref Cuts."

