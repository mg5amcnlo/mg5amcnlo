      type: [float, ...]
      desc: "invariant mass of the pair"
  dims: 0
  desc: "Invariant mass of the two-particle system. See @ref Observable."

---
title: Kinematics

boost_beam:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value to read it off its momentum"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the lab frame"
  desc: "Boosts momenta from the partonic center-of-mass frame to the lab frame given the momentum fractions. See @ref Luminosity."

boost_beam_inverse:
  inputs:
    - name: p1
      type: [float, n, 4]
      desc: "momenta in the lab frame"
    - name: masses
      type: [float, single, n]
      desc: "mass of each particle, or a negative value to read it off its momentum"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
  outputs:
    - name: p_out
      type: [float, n, 4]
      desc: "momenta in the partonic center-of-mass frame"
  desc: "Inverse of `boost_beam`: boosts lab-frame momenta back to the partonic center-of-mass frame."

com_p_in:
  inputs:
    - name: e_cm
      type: [float]
      desc: "center-of-mass energy"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "incoming momentum along +z"
    - name: p2
      type: [float, 4]
      desc: "incoming momentum along -z"
  desc: "Builds the two incoming momenta for a given center-of-mass energy."

r_to_x1x2:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_hat
      type: [float]
      desc: "partonic invariant mass squared"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Maps a random number to the beam momentum fractions at fixed partonic energy. See @ref Luminosity."

x1x2_to_r:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `r_to_x1x2`: maps beam momentum fractions back to the random number. See @ref Luminosity."

r_to_x1x2_window:
  inputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: s_hat
      type: [float]
      desc: "partonic invariant mass squared"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
    - name: y_max
      type: [float, single]
      desc: "largest allowed absolute rapidity of the partonic system"
  outputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "`r_to_x1x2` with the rapidity log(x1/x2)/2 of the partonic system restricted to |y| <= y_max. See @ref PhaseSpaceMapping."

x1x2_to_r_window:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: s_lab
      type: [float, single]
      desc: "hadronic invariant mass squared"
    - name: y_max
      type: [float, single]
      desc: "largest allowed absolute rapidity of the partonic system"
  outputs:
    - name: r
      type: [float]
      desc: "random number in [0, 1]"
    - name: det
      type: [float]
      desc: "Jacobian of the mapping"
  desc: "Inverse of `r_to_x1x2_window`. See @ref PhaseSpaceMapping."

diff_cross_section:
  inputs:
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: pdf1
      type: [float]
      desc: "PDF value for beam 1"
    - name: pdf2
      type: [float]
      desc: "PDF value for beam 2"
    - name: matrix_element
      type: [float]
      desc: "matrix element value"
    - name: e_cm2
      type: [float, single]
      desc: "squared center-of-mass energy"
  outputs:
    - name: result
      type: [float]
      desc: "differential cross section"
  desc: "Assembles the differential cross section from PDFs, the matrix element and the flux factor. See @ref DifferentialCrossSection."

two_body_decay_com:
  inputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
  outputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Two-body decay in the rest frame of the decaying particle. Building block of @ref TwoBodyDecay."

two_body_decay_com_inverse:
  inputs:
    - name: p1
      type: [float, 4]
      desc: "first decay product momentum"
    - name: p2
      type: [float, 4]
      desc: "second decay product momentum"
  outputs:
    - name: r_phi
      type: [float]
      desc: "random number for the azimuthal angle"
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying particle"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
    - name: det
      type: [float]
      desc: "Jacobian of the decay mapping"
  desc: "Inverse of `two_body_decay_com`. Building block of @ref TwoBodyDecay."

com_cos_theta_window:
  inputs:
    - name: r_cos_theta
      type: [float]
      desc: "random number for the polar angle"
    - name: m0
      type: [float]
      desc: "mass of the decaying system (sqrt(s_hat))"
    - name: m1
      type: [float]
      desc: "mass of the first decay product"
    - name: m2
      type: [float]
      desc: "mass of the second decay product"
    - name: x1
      type: [float]
      desc: "momentum fraction of beam 1"
    - name: x2
      type: [float]
      desc: "momentum fraction of beam 2"
    - name: pt_min
      type: [float, single]
      desc: "lower bound on the transverse momentum of the products"
    - name: y_max1
      type: [float, single]
      desc: "bound on the absolute lab rapidity of the first product, negative for none"
    - name: y_max2
      type: [float, single]
      desc: "bound on the absolute lab rapidity of the second product, negative for none"
  outputs:
    - name: r_out
      type: [float]
      desc: "random number for the polar angle, restricted to the range the cuts leave"
    - name: det
      type: [float]
      desc: "fraction of the polar-angle range kept"
  desc: "Restricts the polar angle of `two_body_decay_com` to the range left open by transverse-momentum and rapidity bounds on the products. Building block of @ref TwoBodyDecay."

com_cos_theta_window_inverse:
  inputs:
    - name: r_out
      type: [float]
      desc: "random number for the polar angle, restricted to the range the cuts leave"
    - name: m0
      type: [float]
      desc: "mass of the decaying system (sqrt(s_hat))"
    - name: m1
      type: [float]
