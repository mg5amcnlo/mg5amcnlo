[build-system]
# packaging>=22 is required by scikit-build-core's vendored pyproject_metadata
# (it calls packaging.utils.canonicalize_name(validate=...) / InvalidName, both
# added in packaging 22.0). Pin it explicitly so the build-isolation env does
# not fall back to an older system packaging (e.g. on ubuntu-22.04 / old pip).
requires = [
    "scikit-build-core>=0.10",
    "packaging>=22",
    # Needed by generate_headers.py and generate_pyi.py, which now run as
    # part of the CMake build (see CMakeLists.txt).
    "pyyaml>=6",
    "pybind11-stubgen>=2.5",
]
build-backend = "scikit_build_core.build"

[project]
name = "madspace"
# Taken from the MadGraph VERSION file: madspace is never released on its own,
# so its version is always the MadGraph release version (see tool.scikit-build).
dynamic = ["version"]
description="Fast and flexible phase-space mappings"
readme = "README.md"
authors = [
  { name = "Theo Heimel", email = "theo.heimel@uclouvain.be" },
  { name = "Ramon Winterhalder", email = "ramon.winterhalder@unimi.it" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "numpy",
    "scipy",
    "torch",
]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
minimum-version = "build-system.requires"
cmake.build-type="Release"
cmake.define.ENABLE_SIMD="OFF"
cmake.define.CMAKE_EXPORT_COMPILE_COMMANDS="1"

[tool.scikit-build.metadata.version]
# The standard [[tool.dynamic-metadata]] spelling needs scikit-build-core>=1.0;
# this one works from 0.10 on, which is the floor in build-system.requires.
provider = "scikit_build_core.metadata.regex"
input = "../VERSION"
regex = '(?m)^version\s*=\s*(?P<value>\S+)'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
atomic = true
line_length = 88
